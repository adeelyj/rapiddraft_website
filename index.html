    <meta name="twitter:card" content="summary_large_image" />

    <title>RapidDraft | AI for drawing release and design review</title>
  </head>
  <body>
    <div id="root">
      <style>
        .rd-loader {
          min-height: 100vh;
          display: grid;
          place-items: center;
          background:
            radial-gradient(circle at 50% 42%, rgba(234, 88, 12, 0.12), transparent 30%),
            #fffaf7;
        }

        .rd-loader__mark {
          width: min(22vw, 112px);
          min-width: 82px;
          filter: drop-shadow(0 22px 34px rgba(234, 88, 12, 0.16));
        }

        .rd-loader__bar {
          fill: #e9580b;
          transform-box: fill-box;
          transform-origin: left center;
          transform: scaleX(0.22);
          animation: rd-loader-bar 760ms cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
        }

        .rd-loader__bar:nth-child(2) {
          animation-delay: 85ms;
        }

        .rd-loader__bar:nth-child(3) {
          animation-delay: 170ms;
        }

        @keyframes rd-loader-bar {
          0% {
            transform: scaleX(0.22);
          }

          45% {
            transform: scaleX(1);
          }

          72%, 100% {
            transform: scaleX(1);
          }
        }

        @media (prefers-reduced-motion: reduce) {
          .rd-loader__bar {
            animation: none;
            transform: scaleX(1);
            opacity: 1;
          }
        }
      </style>
      <div class="rd-loader" aria-label="Loading RapidDraft" role="status">
        <svg class="rd-loader__mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1138.7 1049.22" aria-hidden="true">
          <g transform="translate(-2445.06 -476.51)">
            <path class="rd-loader__bar" d="M3583.76,765.1H2582.91a137.85,137.85,0,0,1-137.85-137.85V476.51H3432.3A151.46,151.46,0,0,1,3583.76,628Z" />
            <path class="rd-loader__bar" d="M3442.26,1145.41h-997.2V1004.63a147.81,147.81,0,0,1,147.8-147.81h990.9v147.09A141.5,141.5,0,0,1,3442.26,1145.41Z" />
            <path class="rd-loader__bar" d="M3583.76,1525.73h-559.5a138.5,138.5,0,0,1-138.49-138.49v-150.1H3445a138.8,138.8,0,0,1,138.8,138.8Z" />
          </g>
        </svg>
      </div>
    </div>
    <!-- Netlify form detection for React SPA -->
    <form name="bookdemo" data-netlify="true" netlify hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="role" />
      <input type="text" name="cad-tools" />
      <textarea name="message"></textarea>
    </form>
    <form name="job-application" data-netlify="true" netlify hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
    <form name="nda-request" data-netlify="true" netlify hidden>
      <input type="text" name="full-name" />
      <input type="text" name="title" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="jurisdiction" />
      <textarea name="address"></textarea>
      <input type="text" name="business-unit-site" />
      <input type="text" name="systems-environment" />
      <textarea name="use-case-workflow"></textarea>
      <input type="text" name="submission_recipient" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
